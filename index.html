<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="RentHub GenSan — event, entertainment, photography, camping and beach equipment rentals in General Santos City. Reserve online, pick up in store.">
<meta name="theme-color" content="#12386B">
<meta property="og:title" content="RentHub GenSan">
<meta property="og:description" content="Rent what you need, the smarter choice indeed. Equipment rentals in General Santos City.">
<meta property="og:image" content="assets/logo.jpg">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<title>RentHub GenSan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: sticky brand header, navy hero band with booking search, content sections on a cool neutral ground; admin uses a sidebar console. */
:root{
  --navy:#12386B; --navy-deep:#0A2547; --gold:#D9A229; --gold-ink:#8A6210; --gold-soft:#FBF1D9;
  --leaf:#3C8A3A; --sea:#1F6FB2;
  --bg:#F5F7FA; --surface:#FFFFFF; --surface-2:#EEF2F7; --ink:#0F1E33; --muted:#566781; --line:#DDE3EC;
  --primary:#12386B; --on-primary:#FFFFFF; --link:#1A4E92;
  --ok:#1F7A4A; --ok-bg:#E3F4EA; --warn:#9A6200; --warn-bg:#FDF0D5; --bad:#B42318; --bad-bg:#FDE7E5; --info:#1D5FA8; --info-bg:#E2EDFA;
  --art-a:#12386B; --art-b:#D9A229; --art-c:#FFFFFF; --art-d:#3C8A3A; --art-e:#1F6FB2; --tile:#E8EEF6;
  --shadow:0 1px 2px rgba(15,30,51,.06),0 6px 20px rgba(15,30,51,.07);
  --f-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1424; --surface:#111E34; --surface-2:#172843; --ink:#E7EDF6; --muted:#9DAEC6; --line:#24375A;
  --primary:#E2B13C; --on-primary:#1A1405; --link:#8DB8F0; --gold-soft:#2C2510; --gold-ink:#E9BE55;
  --ok:#5FD39A; --ok-bg:#12331F; --warn:#F2BE5C; --warn-bg:#33270C; --bad:#FF8A80; --bad-bg:#3A1513; --info:#8DB8F0; --info-bg:#12284A;
  --art-a:#9CC2F2; --art-c:#1B2E4F; --tile:#162845; --navy-deep:#081B35;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1424; --surface:#111E34; --surface-2:#172843; --ink:#E7EDF6; --muted:#9DAEC6; --line:#24375A;
  --primary:#E2B13C; --on-primary:#1A1405; --link:#8DB8F0; --gold-soft:#2C2510; --gold-ink:#E9BE55;
  --ok:#5FD39A; --ok-bg:#12331F; --warn:#F2BE5C; --warn-bg:#33270C; --bad:#FF8A80; --bad-bg:#3A1513; --info:#8DB8F0; --info-bg:#12284A;
  --art-a:#9CC2F2; --art-c:#1B2E4F; --tile:#162845; --navy-deep:#081B35;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
a{color:var(--link)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-ink)}
.muted{color:var(--muted)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:999px;padding:10px 18px;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap;transition:transform .12s,background .15s,border-color .15s}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-primary:hover{filter:brightness(1.1)}
.btn-gold{background:var(--gold);color:#1A1405}
.btn-gold:hover{filter:brightness(1.06)}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn-sm{padding:6px 12px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link-btn{background:none;border:0;padding:0;color:var(--link);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* Header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;gap:20px;height:68px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);cursor:pointer;background:none;border:0;padding:0}
.brand img{width:46px;height:46px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px var(--line)}
.brand b{font-family:var(--f-display);font-size:19px;font-weight:800;letter-spacing:-.01em}
.brand b span{color:var(--gold-ink)}
.brand small{display:block;font-size:10.5px;letter-spacing:.2em;color:var(--muted);font-weight:700;margin-top:-2px}
.nav{display:flex;gap:4px;margin-left:12px}
.nav button{background:none;border:0;padding:8px 12px;border-radius:8px;font-weight:600;color:var(--muted);cursor:pointer}
.nav button:hover{color:var(--ink);background:var(--surface-2)}
.nav button.on{color:var(--ink);box-shadow:inset 0 -2px 0 var(--gold);border-radius:0}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.icon-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink)}
.icon-btn:hover{background:var(--surface-2)}
.badge-count{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--gold);color:#1A1405;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.user-chip{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border:1px solid var(--line);border-radius:999px;background:var(--surface);cursor:pointer;font-weight:600}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.menu-toggle{display:none}
.topbar{background:var(--navy-deep);color:#D8E2F0;font-size:12.5px}
.topbar .wrap{display:flex;gap:18px;justify-content:space-between;padding-block:7px;flex-wrap:wrap}
.topbar b{color:#F3C962;font-weight:600}

/* Hero */
.hero{background:radial-gradient(1200px 400px at 85% -10%,rgba(217,162,41,.22),transparent 60%),linear-gradient(180deg,#12386B,#0C2A52);color:#fff;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center;padding-block:56px 64px}
.hero h1{font-size:clamp(34px,5vw,56px);font-weight:800;color:#fff}
.hero h1 em{font-style:normal;color:#F3C962}
.hero p.lead{font-size:18px;color:#C9D6EA;max-width:52ch;margin-top:16px}
.search-card{margin-top:28px;background:var(--surface);color:var(--ink);border-radius:16px;padding:14px;display:grid;grid-template-columns:1.2fr 1fr 1fr auto;gap:10px;box-shadow:0 20px 40px rgba(0,0,0,.25)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.input,select.input,textarea.input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0}
select option{color:var(--ink);background:var(--surface)}
.input:focus{outline:2px solid var(--gold);outline-offset:0;border-color:transparent}
.search-card .btn{align-self:end;height:44px}
.hero-trust{display:flex;gap:22px;margin-top:22px;flex-wrap:wrap;font-size:13.5px;color:#C9D6EA}
.hero-trust span{display:flex;align-items:center;gap:7px}
.hero-trust svg{color:#F3C962}
.hero-art{position:relative;display:flex;justify-content:center}
.hero-logo{width:min(360px,80%);aspect-ratio:1;max-width:100%;border-radius:50%;background:#fff;padding:10px;box-shadow:0 0 0 10px rgba(255,255,255,.06),0 0 0 22px rgba(255,255,255,.04),0 30px 60px rgba(0,0,0,.35)}
.float-chip{position:absolute;background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 14px;box-shadow:0 12px 30px rgba(0,0,0,.25);font-size:13px;display:flex;gap:10px;align-items:center}
.float-chip b{display:block;font-size:14px}
.float-chip .dot{width:10px;height:10px;border-radius:50%;background:#2FB36B;flex:none;box-shadow:0 0 0 4px rgba(47,179,107,.2)}
.fc1{left:0;top:16%}.fc2{right:0;bottom:12%}

/* Sections */
.section{padding-block:64px}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:28px;flex-wrap:wrap}
.sec-head h2{font-size:clamp(26px,3.2vw,36px);font-weight:800;margin-top:6px}
.sec-head p{color:var(--muted);max-width:56ch;margin-top:8px}
.cat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.cat-tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:10px;transition:border-color .15s,transform .15s}
.cat-tile:hover{border-color:var(--gold);transform:translateY(-2px)}
.cat-tile .art{border-radius:10px;aspect-ratio:4/3}
.cat-tile h3{font-size:17px}
.cat-tile small{color:var(--muted);font-size:13px;line-height:1.4}
.cat-tile .cat-meta{font-size:12.5px;font-weight:700;color:var(--gold-ink);margin-top:auto}

.art{background:var(--tile);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;max-width:100%}
.art svg{width:78%;height:auto;max-height:86%}
.art .equipment-photo{width:100%;height:100%;min-width:0;object-fit:contain;padding:10px}
.art.paired .equipment-photo{width:50%;padding:6px}
.art[data-cat="events"]{background:linear-gradient(160deg,var(--tile),color-mix(in srgb,var(--gold) 14%,var(--tile)))}
.art[data-cat="entertainment"]{background:linear-gradient(160deg,var(--tile),color-mix(in srgb,#8a5cc8 12%,var(--tile)))}
.art[data-cat="photography"]{background:linear-gradient(160deg,var(--tile),color-mix(in srgb,var(--sea) 14%,var(--tile)))}
.art[data-cat="outdoor"]{background:linear-gradient(160deg,var(--tile),color-mix(in srgb,var(--leaf) 16%,var(--tile)))}
.art[data-cat="beach"]{background:linear-gradient(160deg,var(--tile),color-mix(in srgb,#1aa3b8 18%,var(--tile)))}

.package-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.package-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px}
.package-card h3{font-size:19px}
.package-price{font-family:var(--f-display);font-size:28px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.package-price small{font-family:var(--f-body);font-size:13px;font-weight:600;color:var(--muted)}
.package-deposit{display:flex;justify-content:space-between;gap:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13.5px}
.package-deposit b{font-variant-numeric:tabular-nums}
.package-includes{list-style:none;padding:0;margin:0;display:grid;gap:7px;font-size:13.5px;color:var(--muted)}
.package-includes li{display:flex;justify-content:space-between;gap:12px}
.package-includes b{color:var(--ink);font-weight:700}
.package-includes li.package-fin-choice{display:grid;gap:6px}
.package-fin-choice label{font-size:12px;font-weight:700;color:var(--ink)}
.package-card .btn{margin-top:auto}
.package-note{font-size:13px;color:var(--muted);margin-top:16px}

.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;counter-reset:s}
.step{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:8px}
.step .n{width:34px;height:34px;border-radius:50%;background:var(--gold-soft);color:var(--gold-ink);font-weight:800;display:flex;align-items:center;justify-content:center;font-family:var(--f-display)}
.step h3{font-size:18px}
.step p{color:var(--muted);font-size:14.5px}

.pickup-band{background:var(--navy-deep);color:#DCE6F4}
.pickup-band .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;padding-block:56px;align-items:start}
.pickup-band h2{color:#fff;font-size:clamp(26px,3vw,34px)}
.pickup-band .eyebrow{color:#F3C962}
.policy-list{list-style:none;padding:0;margin:20px 0 0;display:grid;gap:12px}
.policy-list li{display:flex;gap:12px;align-items:flex-start}
.policy-list svg{flex:none;color:#F3C962;margin-top:2px}
.shop-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:22px;display:grid;gap:14px}
.shop-card h3{color:#fff;font-size:20px}
.hours{display:grid;grid-template-columns:auto 1fr;gap:4px 18px;font-size:14px}
.hours dt{color:#9FB2CF}.hours dd{margin:0;color:#fff;font-variant-numeric:tabular-nums}

.quotes{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.quote{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:14px}
.quote p{font-size:15.5px}
.quote footer{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--muted);margin-top:auto}
.stars{color:var(--gold);letter-spacing:2px}

/* Product cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .15s,transform .15s}
.card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.card .art{aspect-ratio:4/3;cursor:pointer;border:0;width:100%;padding:0}
.card-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.card-cat{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card h3{font-size:18px}
.card p.desc{font-size:13.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.price{font-family:var(--f-display);font-weight:800;font-size:20px}
.price small{font-family:var(--f-body);font-weight:500;font-size:13px;color:var(--muted)}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:6px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--info-bg);color:var(--info)}
.pill.neutral{background:var(--surface-2);color:var(--muted)}
.art .tag{position:absolute;top:10px;left:10px}

/* Catalog layout */
.page-head{background:var(--surface);border-bottom:1px solid var(--line)}
.page-head .wrap{padding-block:28px}
.page-head h1{font-size:clamp(28px,3.4vw,38px);font-weight:800;margin-top:4px}
.crumbs{font-size:13px;color:var(--muted)}
.catalog{display:grid;grid-template-columns:260px 1fr;gap:28px;padding-block:28px 64px;align-items:start}
.filters{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:18px}
.filters h4{font-family:var(--f-body);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cat-list{display:grid;gap:2px}
.cat-list button{display:flex;justify-content:space-between;align-items:center;background:none;border:0;padding:8px 10px;border-radius:8px;cursor:pointer;text-align:left;font-weight:600;color:var(--ink)}
.cat-list button:hover{background:var(--surface-2)}
.cat-list button.on{background:var(--gold-soft);color:var(--gold-ink)}
.cat-list span{font-size:12px;color:var(--muted);font-weight:600}
.period-note{font-size:13px;background:var(--surface-2);border-radius:8px;padding:10px 12px}
.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;font-size:13.5px;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--primary);color:var(--on-primary);border-color:transparent}
.mobile-only{display:none}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(6,15,30,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:18px;width:min(880px,100%);max-height:100%;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.4);position:relative}
.modal.sm{width:min(480px,100%)}
.modal-x{position:absolute;top:12px;right:12px;z-index:2}
.pd{display:grid;grid-template-columns:1fr 1fr}
.pd .art{min-height:340px;height:100%}
.pd-body{padding:28px;display:flex;flex-direction:column;gap:14px;min-width:0}
.pd-body h2{font-size:28px;font-weight:800}
.incl{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:14px}
.incl li{display:flex;gap:8px}
.incl li::before{content:"✓";color:var(--ok);font-weight:800}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv div{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.kv small{display:block;font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.kv b{font-size:16px;font-variant-numeric:tabular-nums}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.qty button{width:36px;height:36px;border:0;background:none;cursor:pointer;font-size:18px;font-weight:700;color:var(--ink)}
.qty button:hover{background:var(--surface-2)}
.qty input{width:52px;text-align:center;border:0;background:none;font-weight:700;font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.notice{display:flex;gap:10px;padding:12px 14px;border-radius:10px;font-size:13.5px;align-items:flex-start}
.notice svg{flex:none;margin-top:2px}
.notice.gold{background:var(--gold-soft);color:var(--ink)}
.notice.gold svg{color:var(--gold-ink)}
.notice.bad{background:var(--bad-bg);color:var(--bad)}
.notice.info{background:var(--info-bg);color:var(--info)}

/* Cart / checkout */
.layout-2{display:grid;grid-template-columns:1fr 360px;gap:28px;padding-block:28px 64px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.panel-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.panel-h h3{font-size:18px}
.panel-b{padding:20px}
.line{display:grid;grid-template-columns:96px 1fr auto;gap:16px;padding:16px 20px;border-bottom:1px solid var(--line);align-items:center}
.line:last-child{border-bottom:0}
.line .art{width:96px;height:72px;border-radius:10px}
.line h4{font-size:16px}
.line-meta{font-size:13px;color:var(--muted)}
.line-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.summary{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px)}
.sum-row{display:flex;justify-content:space-between;gap:12px;font-size:14.5px;padding:6px 0;font-variant-numeric:tabular-nums}
.sum-row.total{border-top:1px solid var(--line);margin-top:8px;padding-top:12px;font-weight:800;font-size:18px;font-family:var(--f-display)}
.empty{padding:48px 24px;text-align:center;display:grid;gap:12px;justify-items:center}
.empty svg{color:var(--muted)}
.opt{display:flex;gap:12px;border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;align-items:flex-start}
.opt:has(input:checked){border-color:var(--gold);background:var(--gold-soft)}
.opt input{margin-top:3px;accent-color:var(--navy)}
.opt b{display:block}
.opt small{color:var(--muted)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.slot{border:1px solid var(--line);border-radius:10px;padding:9px;text-align:center;cursor:pointer;font-weight:600;font-size:14px;background:var(--surface)}
.slot.on{background:var(--primary);color:var(--on-primary);border-color:transparent}
.confirm-hero{text-align:center;display:grid;gap:12px;justify-items:center;padding:32px 20px}
.code-big{font-family:var(--f-mono);font-size:28px;font-weight:600;letter-spacing:.08em;background:var(--gold-soft);color:var(--gold-ink);padding:10px 20px;border-radius:12px;border:1px dashed var(--gold)}
.check-ring{width:64px;height:64px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:flex;align-items:center;justify-content:center}

/* Auth */
.auth{display:grid;grid-template-columns:1fr 1fr;min-height:560px;margin-block:36px 64px;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.auth-side{background:linear-gradient(170deg,#12386B,#0A2547);color:#DCE6F4;padding:40px;display:flex;flex-direction:column;gap:18px}
.auth-side h2{color:#fff;font-size:30px}
.auth-side img{width:120px;height:120px;border-radius:50%;background:#fff}
.auth-form{padding:40px;display:grid;gap:14px;align-content:start}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:999px;width:max-content;max-width:100%}
.tabs button{border:0;background:none;padding:8px 18px;border-radius:999px;font-weight:700;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.demo-acc{font-size:13px;border:1px dashed var(--line);border-radius:10px;padding:12px;display:grid;gap:6px}
.demo-acc button{text-align:left}
.err{color:var(--bad);font-size:13.5px;font-weight:600}

/* Dashboard */
.dash-head{background:var(--surface);border-bottom:1px solid var(--line)}
.dash-head .wrap{padding-block:28px;display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.stat small{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stat b{display:block;font-family:var(--f-display);font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:4px}
.stat span{font-size:12.5px;color:var(--muted)}
.res-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.res-top{display:flex;gap:16px;justify-content:space-between;align-items:center;padding:16px 20px;flex-wrap:wrap}
.res-top .code{font-family:var(--f-mono);font-weight:600;font-size:15px}
.res-dates{display:flex;gap:18px;flex-wrap:wrap;font-size:14px}
.res-dates b{display:block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.res-items{display:flex;gap:8px;flex-wrap:wrap;padding:0 20px 16px}
.res-item{display:flex;gap:8px;align-items:center;background:var(--surface-2);border-radius:10px;padding:6px 10px 6px 6px;font-size:13.5px}
.res-item .art{width:36px;height:28px;border-radius:6px}
.timeline{display:flex;gap:0;padding:14px 20px;border-top:1px solid var(--line);background:var(--surface-2);overflow-x:auto}
.tl{flex:1;min-width:110px;display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted);position:relative}
.tl i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:var(--surface);position:relative;z-index:1}
.tl::after{content:"";position:absolute;left:14px;right:0;top:6px;height:2px;background:var(--line)}
.tl:last-child::after{display:none}
.tl.done{color:var(--ink);font-weight:600}
.tl.done i{background:var(--ok);border-color:var(--ok)}
.tl.done::after{background:var(--ok)}
.tl.cur i{border-color:var(--gold);background:var(--gold)}
.res-actions{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.stack{display:grid;gap:14px}

/* Admin */
.admin{display:grid;grid-template-columns:232px 1fr;min-height:calc(100vh - 68px)}
.side{background:var(--navy-deep);color:#C6D3E7;padding:20px 12px;display:flex;flex-direction:column;gap:4px}
.side h5{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#7F94B5;margin:14px 10px 6px;font-family:var(--f-body)}
.side button{display:flex;align-items:center;gap:10px;background:none;border:0;color:inherit;padding:10px 12px;border-radius:8px;cursor:pointer;font-weight:600;text-align:left}
.side button:hover{background:rgba(255,255,255,.06);color:#fff}
.side button.on{background:rgba(217,162,41,.16);color:#F3C962}
.side .count{margin-left:auto;background:#D9A229;color:#1A1405;border-radius:10px;font-size:11px;padding:1px 7px;font-weight:800}
.admin-main{padding:28px max(16px,env(safe-area-inset-right,0px)) 64px 28px;min-width:0;display:grid;gap:20px;align-content:start}
.admin-main h1{font-size:28px;font-weight:800}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.cell-item{display:flex;gap:10px;align-items:center;min-width:200px}
.cell-item .art{width:48px;height:36px;border-radius:7px;flex:none}
.cal{border-collapse:separate;border-spacing:3px;font-size:12.5px}
.cal th{background:none;border:0;padding:4px;text-align:center;font-size:11px;letter-spacing:0}
.cal th.today{color:var(--gold-ink)}
.cal td{border:0;padding:0}
.cal td.nm{padding-right:10px;white-space:nowrap;font-weight:600;font-size:13px}
.cal .c{width:44px;height:34px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;font-variant-numeric:tabular-nums}
.c.l0{background:var(--ok-bg);color:var(--ok)}
.c.l1{background:var(--warn-bg);color:var(--warn)}
.c.l2{background:var(--bad-bg);color:var(--bad)}
.c.mt{background:var(--surface-2);color:var(--muted)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:flex;gap:6px;align-items:center}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
.list-row{display:flex;justify-content:space-between;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);align-items:center;flex-wrap:wrap}
.list-row:last-child{border-bottom:0}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.bar{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--gold);border-radius:4px}
.toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13.5px;font-weight:600}
.toggle input{accent-color:var(--navy);width:16px;height:16px}

/* Footer */
.foot{background:var(--surface);border-top:1px solid var(--line);margin-top:0}
.foot .wrap{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:28px;padding-block:44px}
.foot h4{font-size:14px;font-family:var(--f-body);font-weight:700;margin-bottom:10px}
.foot ul{list-style:none;padding:0;margin:0;display:grid;gap:6px;font-size:14px;color:var(--muted)}
.foot ul button{background:none;border:0;padding:0;color:inherit;cursor:pointer}
.foot ul button:hover{color:var(--ink)}
.foot-bottom{border-top:1px solid var(--line)}
.foot-bottom .wrap{display:flex;justify-content:space-between;padding-block:16px;font-size:12.5px;color:var(--muted);gap:12px;flex-wrap:wrap}
.preview-flag{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;opacity:.85}

/* Toast */
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:200;display:grid;gap:8px;max-width:min(380px,calc(100vw - 32px))}
.toast{background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:var(--shadow);animation:tin .25s ease}
.toast.bad{background:var(--bad);color:#fff}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Responsive */
@media (max-width:1020px){
  .cat-grid{grid-template-columns:repeat(3,1fr)}
  .package-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero .wrap{grid-template-columns:1fr}
  .hero-art{display:none}
  .search-card{grid-template-columns:1fr 1fr}
  .search-card .btn{grid-column:1/-1}
  .catalog{grid-template-columns:1fr}
  .filters{position:static}
  .layout-2{grid-template-columns:1fr}
  .summary{position:static}
  .admin{grid-template-columns:1fr}
  .side{flex-direction:row;overflow-x:auto;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
  .side h5,.side .spacer{display:none}
  .side button{white-space:nowrap}
  .admin-main{padding-left:max(16px,env(safe-area-inset-left,0px))}
  .foot .wrap{grid-template-columns:1fr 1fr}
  .pickup-band .wrap{grid-template-columns:1fr}
}
@media (max-width:760px){
  .nav{display:none}
  .nav.open{display:flex;position:absolute;top:68px;left:0;right:0;flex-direction:column;background:var(--surface);border-bottom:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));margin:0}
  .nav.open button.on{box-shadow:inset 3px 0 0 var(--gold)}
  .menu-toggle{display:inline-flex}
  .user-chip .nm{display:none}
  .cat-grid{grid-template-columns:repeat(2,1fr)}
  .steps,.quotes,.grid-2{grid-template-columns:1fr}
  .package-grid{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .pd{grid-template-columns:1fr}
  .pd .art{min-height:200px}
  .auth{grid-template-columns:1fr}
  .auth-side{display:none}
  .auth-form{padding:24px}
  .line{grid-template-columns:64px 1fr;}
  .line .art{width:64px;height:52px}
  .line-right{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center}
  .topbar .hide-sm{display:none}
  .brand small{display:none}
  .two{grid-template-columns:1fr}
}
@media (max-width:440px){
  .search-card{grid-template-columns:1fr}
  .foot .wrap{grid-template-columns:1fr}
  .cat-grid{grid-template-columns:1fr 1fr;gap:10px}
  .hdr .wrap{gap:10px}
  .brand b{font-size:17px}
}
/* ===== Premium layer ===== */
:root{--studio:#F3F6FA;--studio-2:#E2E9F3;--serif:"Instrument Serif","Times New Roman",Georgia,serif;--gold-grad:linear-gradient(180deg,#EDC155,#C99520)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--studio:#1B3053;--studio-2:#0F1E36}}
:root[data-theme="dark"]{--studio:#1B3053;--studio-2:#0F1E36}
.serif{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:0}
.eyebrow{display:inline-flex;align-items:center;gap:10px}
.eyebrow::before{content:"";width:22px;height:1.5px;background:currentColor;opacity:.7}
.topbar{background:#071A33;letter-spacing:.02em}
.hdr{background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px)}
.hdr .wrap{height:74px}
.btn{letter-spacing:.01em}
.btn-gold{background:var(--gold-grad);color:#1A1405;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 18px rgba(201,149,32,.32)}
.btn-gold:hover{filter:brightness(1.05);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 10px 26px rgba(201,149,32,.42)}
.btn-primary{box-shadow:0 6px 16px color-mix(in srgb,var(--primary) 28%,transparent)}
.btn-lg{padding:14px 26px;font-size:16px}

/* Hero */
.hero{position:relative;background:radial-gradient(900px 520px at 78% 30%,rgba(232,181,64,.20),transparent 60%),radial-gradient(700px 400px at 0% 100%,rgba(31,111,178,.35),transparent 60%),linear-gradient(165deg,#103463 0%,#0A2547 55%,#071A33 100%)}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(ellipse at 70% 40%,#000 20%,transparent 70%);-webkit-mask-image:radial-gradient(ellipse at 70% 40%,#000 20%,transparent 70%);pointer-events:none}
.hero .wrap{position:relative;padding-block:72px 40px;grid-template-columns:1.05fr .95fr;gap:48px}
.hero-kicker{display:inline-flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);font-size:13px;color:#DCE6F4}
.hero-kicker b{background:var(--gold-grad);color:#1A1405;border-radius:999px;padding:2px 10px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
.hero h1{font-size:clamp(40px,5.6vw,72px);letter-spacing:-.025em;line-height:1.02;margin-top:22px}
.hero h1 .serif{color:#F0C55A;font-size:1.08em;line-height:.9}
.hero p.lead{font-size:18.5px;line-height:1.6;color:#BFD0E8}
.search-card{border-radius:20px;padding:10px;grid-template-columns:1.25fr 1fr 1fr auto;gap:0;margin-top:34px;box-shadow:0 30px 60px rgba(2,10,25,.45),0 0 0 1px rgba(255,255,255,.08)}
.search-card .field{padding:8px 14px;border-right:1px solid var(--line)}
.search-card .field:nth-child(3){border-right:0}
.search-card .input{border:0;padding:4px 0;font-weight:600;font-size:15px;background:transparent}
.search-card .input:focus{outline:0}
.search-card .field:focus-within{background:var(--surface-2);border-radius:12px}
.search-card .btn{height:auto;align-self:stretch;border-radius:14px;padding-inline:24px}
.hero-trust{margin-top:26px;gap:26px}
.showcase{position:relative;width:100%;max-width:540px;aspect-ratio:1;margin-inline:auto}
.seal{position:absolute;inset:14%;border-radius:50%;background:#fff;padding:8px;box-shadow:0 0 0 1px rgba(240,197,90,.5),0 0 0 14px rgba(255,255,255,.04),0 0 0 15px rgba(240,197,90,.18),0 0 0 34px rgba(255,255,255,.03),0 40px 80px rgba(0,0,0,.45)}
.seal img{width:100%;height:100%;border-radius:50%;display:block}
.plinth{position:absolute;display:flex;align-items:center;gap:12px;padding:8px 16px 8px 8px;border-radius:16px;background:var(--surface);color:var(--ink);box-shadow:0 18px 40px rgba(0,0,0,.32);font-size:13px;animation:bob 7s ease-in-out infinite}
.plinth .art{width:84px;height:66px;border-radius:12px;flex:none}
.plinth .art::after{display:none}
.plinth b{display:block;font-size:14.5px}
.plinth span{color:var(--muted)}
.plinth span em{font-style:normal;color:var(--gold-ink);font-weight:700}
.p1{left:-4%;top:8%}.p2{right:-6%;top:44%;animation-delay:-2.3s}.p3{left:2%;bottom:4%;animation-delay:-4.6s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.hero-stats{position:relative;border-top:1px solid rgba(255,255,255,.1)}
.hero-stats .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;padding-block:26px 30px;grid-template-rows:auto}
.hstat{display:flex;flex-direction:column;gap:2px;color:#AFC1DB;font-size:13.5px}
.hstat b{font-family:var(--serif);font-style:italic;font-weight:400;font-size:38px;line-height:1;color:#fff}
.hstat b i{color:#F0C55A;font-style:italic}

/* Sections */
.section{padding-block:88px}
.sec-head{margin-bottom:36px}
.sec-head h2{font-size:clamp(30px,3.8vw,46px);letter-spacing:-.02em;line-height:1.05}
.sec-head h2 .serif{color:var(--gold-ink);font-size:1.06em}
.sec-head.center{flex-direction:column;align-items:center;text-align:center}
.sec-head.center p{margin-inline:auto}

/* Bento categories */
.bento{display:grid;grid-template-columns:1.25fr 1fr 1fr;grid-template-rows:repeat(2,minmax(250px,auto));gap:16px}
.bento .tile{position:relative;border:0;border-radius:22px;overflow:hidden;cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column;background:var(--surface);box-shadow:var(--shadow);transition:transform .25s,box-shadow .25s;color:var(--ink)}
.bento .tile:hover{transform:translateY(-4px);box-shadow:0 2px 4px rgba(15,30,51,.06),0 24px 48px rgba(15,30,51,.14)}
.bento .tile:first-child{grid-row:span 2}
.bento .tile .art{flex:1;min-height:150px}
.bento .tile:first-child .art{min-height:300px}
.bento .tile:first-child .art svg{width:62%}
.tile-body{padding:18px 20px 20px;display:grid;gap:6px}
.tile-body h3{font-size:22px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.tile-body h3 .arr{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;transition:background .2s,color .2s,border-color .2s}
.bento .tile:hover .arr{background:var(--gold);border-color:var(--gold);color:#1A1405}
.tile-body small{color:var(--muted);font-size:13.5px}
.tile-body .cat-meta{font-size:13px;font-weight:700;color:var(--gold-ink)}

/* Studio-lit product art */
.art{--tint:var(--gold);background:radial-gradient(70% 65% at 50% 38%,color-mix(in srgb,var(--tint) 16%,var(--studio)) 0%,var(--studio) 55%,var(--studio-2) 100%)!important}
.art[data-cat="entertainment"]{--tint:#8a5cc8}.art[data-cat="photography"]{--tint:var(--sea)}.art[data-cat="outdoor"]{--tint:var(--leaf)}.art[data-cat="beach"]{--tint:#16a3b8}
.art svg{position:relative;z-index:1;filter:drop-shadow(0 12px 14px rgba(8,24,52,.22))}
.art::after{content:"";position:absolute;left:22%;right:22%;bottom:9%;height:10%;border-radius:50%;background:radial-gradient(closest-side,rgba(8,24,52,.22),transparent);z-index:0}
.line .art::after,.res-item .art::after,.cell-item .art::after{display:none}

/* Product cards */
.grid{gap:22px}
.card{border:0;border-radius:20px;box-shadow:var(--shadow)}
.card:hover{transform:translateY(-4px);box-shadow:0 2px 4px rgba(15,30,51,.06),0 24px 48px rgba(15,30,51,.14)}
.card .art{aspect-ratio:5/4}
.card .art svg{transition:transform .35s ease}
.card:hover .art svg{transform:scale(1.05) translateY(-3px)}
.card-body{padding:18px 20px 20px;gap:8px}
.card h3{font-size:20px}
.price{font-size:22px}

/* RentHub standard */
.standard{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.std{padding:26px 22px;border-radius:20px;background:var(--surface);box-shadow:var(--shadow);display:grid;gap:10px;align-content:start}
.std .ring{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--gold-ink);background:var(--gold-soft);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--gold) 45%,transparent)}
.std h3{font-size:18px}
.std p{color:var(--muted);font-size:14.5px}

/* Steps */
.steps{gap:0;background:var(--surface);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.step{border:0;border-radius:0;padding:30px 28px;background:none;border-right:1px solid var(--line)}
.step:last-child{border-right:0}
.step .n{width:auto;height:auto;background:none;font-family:var(--serif);font-style:italic;font-weight:400;font-size:52px;line-height:1;color:var(--gold-ink)}

/* Testimonials */
.testi{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:stretch}
.feature-quote{background:linear-gradient(160deg,#12386B,#0A2547);color:#E2EAF6;border-radius:22px;padding:40px;display:flex;flex-direction:column;gap:22px;position:relative;overflow:hidden}
.feature-quote::before{content:"“";position:absolute;right:24px;top:-30px;font-family:var(--serif);font-size:220px;color:rgba(240,197,90,.18);line-height:1}
.feature-quote p{font-family:var(--serif);font-size:clamp(24px,2.6vw,32px);line-height:1.3;color:#fff;position:relative}
.feature-quote footer{display:flex;gap:12px;align-items:center;margin-top:auto;font-size:14px;color:#AFC1DB}
.feature-quote footer b{color:#fff}
.side-quotes{display:grid;gap:20px}
.quote{border:0;border-radius:20px;box-shadow:var(--shadow)}
.rating-sum{display:flex;gap:14px;align-items:center;font-size:14px;color:var(--muted);margin-top:18px;flex-wrap:wrap}
.rating-sum b{font-family:var(--serif);font-style:italic;font-weight:400;font-size:34px;color:var(--ink);line-height:1}

/* Pickup band */
.pickup-band{background:radial-gradient(600px 300px at 90% 0%,rgba(240,197,90,.14),transparent 60%),#071A33}
.pickup-band h2{font-size:clamp(30px,3.6vw,44px);letter-spacing:-.02em}
.shop-card{background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.03));border-color:rgba(240,197,90,.25);border-radius:22px;padding:28px;align-self:center}

/* CTA */
.cta{border-radius:26px;padding:48px;display:grid;grid-template-columns:1fr auto;gap:28px;align-items:center;background:radial-gradient(500px 260px at 100% 0%,rgba(255,255,255,.35),transparent 60%),var(--gold-grad);color:#1A1405;box-shadow:0 30px 60px rgba(201,149,32,.25)}
.cta h2{font-size:clamp(28px,3.4vw,42px);letter-spacing:-.02em}
.cta h2 .serif{font-size:1.06em}
.cta p{margin-top:8px;color:#3B2E0C;max-width:52ch}
.cta .btn-dark{background:#0A2547;color:#fff}
.cta .btn-dark:hover{background:#12386B}

/* Page heads */
.page-head{background:linear-gradient(165deg,#103463,#0A2547 60%,#071A33);border:0;position:relative;overflow:hidden}
.page-head::after{content:"";position:absolute;right:-80px;top:-120px;width:360px;height:360px;border-radius:50%;background:radial-gradient(closest-side,rgba(240,197,90,.22),transparent)}
.page-head .wrap{padding-block:40px;position:relative;z-index:1}
.page-head h1{color:#fff;font-size:clamp(32px,4vw,48px);letter-spacing:-.02em}
.page-head .crumbs{color:#9FB2CF}
.filters,.panel{border-radius:18px}
.filters{border:0;box-shadow:var(--shadow)}
.dash-head{background:linear-gradient(165deg,#103463,#0A2547 60%,#071A33);border:0;color:#DCE6F4}
.dash-head h1{color:#fff}
.dash-head .eyebrow{color:#F0C55A}
.dash-head .muted{color:#AFC1DB}
.dash-head .btn-ghost{color:#fff;border-color:rgba(255,255,255,.3)}
.dash-head .btn-ghost:hover{background:rgba(255,255,255,.08)}
.dash-head .btn-primary{background:var(--gold-grad);color:#1A1405}
.stat{border:0;box-shadow:var(--shadow);border-radius:18px;position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:var(--gold-grad)}
.res-card{border:0;box-shadow:var(--shadow);border-radius:18px}
.auth{border:0;box-shadow:0 30px 70px rgba(15,30,51,.14);border-radius:24px}
.auth-side{background:radial-gradient(400px 260px at 100% 0%,rgba(240,197,90,.2),transparent 60%),linear-gradient(170deg,#12386B,#071A33)}
.side{background:linear-gradient(180deg,#0A2547,#071A33)}

/* Footer */
.foot{background:#06162C;border-top:0;color:#AFC1DB}
.foot h4{color:#fff}
.foot ul{color:#AFC1DB}
.foot ul button:hover{color:#F0C55A}
.foot .muted{color:#8FA3C2}
.foot .brand{color:#fff}
.foot .brand b span{color:#F0C55A}
.foot .brand small{color:#8FA3C2}
.foot-bottom{border-top:1px solid rgba(255,255,255,.08)}
.foot-bottom .wrap{color:#7F94B5}
.foot .wrap{padding-block:56px}

/* Load-in (from visible state) */
@keyframes rise{from{transform:translateY(14px)}to{transform:none}}
.hero h1,.hero .lead,.search-card{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.hero .lead{animation-delay:.06s}.search-card{animation-delay:.12s}

@media (max-width:1020px){
  .hero .wrap{grid-template-columns:1fr;padding-block:52px 32px}
  .showcase{display:none}
  .search-card{grid-template-columns:1fr 1fr;gap:4px}
  .search-card .field{border-right:0;border-bottom:1px solid var(--line)}
  .search-card .field:first-child{grid-column:1/-1}
  .search-card .btn{grid-column:1/-1;padding-block:14px}
  .hero-stats .wrap{grid-template-columns:repeat(2,1fr)}
  .bento{grid-template-columns:1fr 1fr;grid-template-rows:none}
  .bento .tile:first-child{grid-row:auto;grid-column:1/-1}
  .bento .tile:first-child .art{min-height:220px}
  .standard{grid-template-columns:1fr 1fr}
  .testi{grid-template-columns:1fr}
  .cta{grid-template-columns:1fr;padding:32px}
}
@media (max-width:760px){
  .section{padding-block:60px}
  .steps{grid-template-columns:1fr}
  .step{border-right:0;border-bottom:1px solid var(--line)}
  .step:last-child{border-bottom:0}
  .feature-quote{padding:28px}
}
@media (max-width:600px){
  .search-card .field:nth-child(2),.search-card .field:nth-child(3){grid-column:1/-1}
}
@media (max-width:440px){
  .search-card{grid-template-columns:1fr}
  .bento{grid-template-columns:1fr}
  .standard{grid-template-columns:1fr}
  .hstat b{font-size:32px}
}

  for(const source of SEED_ITEMS){
    let stored=DB.items.find(i=>i.id===source.id);
    if(!stored){stored={...source,status:'active'};DB.items.push(stored)}
    Object.assign(stored,{name:source.name,price:source.price,deposit:source.deposit});
  }
  const legacyFins=DB.items.find(i=>i.id==='fins');
  if(legacyFins){
    const bookedByDay={};
    for(const r of DB.reservations||[]){
      if(!['pending','confirmed','picked_up'].includes(r.status)) continue;
      const qty=(r.lines||[]).filter(l=>l.itemId==='fins').reduce((sum,l)=>sum+l.qty,0);
      if(qty) for(const day of eachDay(r.start,r.end)) bookedByDay[day]=(bookedByDay[day]||0)+qty;
    }
    const peakBooked=Math.max(0,...Object.values(bookedByDay));
    const legacyStock=Math.max(legacyFins.stock||0,peakBooked);
    const plasticStock=Math.max(Math.min(8,legacyStock),peakBooked);
    const remaining=Math.max(0,legacyStock-plasticStock);
    DB.items.find(i=>i.id==='fins-plastic').stock=plasticStock;
    DB.items.find(i=>i.id==='fins-plastic').status=legacyFins.status||'active';
    DB.items.find(i=>i.id==='fins-carbon').stock=Math.floor(remaining/2);
    DB.items.find(i=>i.id==='fins-ice').stock=remaining-Math.floor(remaining/2);
    for(const r of DB.reservations||[]) for(const line of r.lines||[]) if(line.itemId==='fins'){
      line.itemId='fins-plastic';
      line.price=DB.items.find(i=>i.id==='fins-plastic').price;
      line.deposit=DB.items.find(i=>i.id==='fins-plastic').deposit;
    }
    for(const line of DB.cart||[]) if(line.itemId==='fins') line.itemId='fins-plastic';
    DB.items=DB.items.filter(i=>i.id!=='fins');
  }
  for(const r of DB.reservations||[]) for(const line of r.lines||[]){
    const source=SEED_ITEMS.find(i=>i.id===line.itemId);
    if(source) Object.assign(line,{price:source.price,deposit:source.deposit});

}

/* ---------- double-booking engine ---------- */
function bookedOn(itemId, day, exclude){
  let n=0;
  for(const r of DB.reservations){
    if(r.code===exclude || !HOLD.includes(r.status)) continue;
    if(r.start<=day && day<=r.end) for(const l of r.lines) if(l.itemId===itemId) n+=l.qty;
  }
  return n;
}
function available(itemId, start, end, exclude){
  const it=item(itemId); if(!it || it.status!=='active') return 0;
  let peak=0; for(const d of eachDay(start,end)) peak=Math.max(peak,bookedOn(itemId,d,exclude));
  return Math.max(0, it.stock-peak);
}
function conflicts(lines, start, end, exclude){
  const need={}; lines.forEach(l=>need[l.itemId]=(need[l.itemId]||0)+l.qty);
  return Object.entries(need).filter(([id,q])=>available(id,start,end,exclude)<q).map(([id,q])=>({id,need:q,have:available(id,start,end,exclude)}));
}
function availPill(it){
  if(it.status!=='active') return '<span class="pill neutral">Under maintenance</span>';
  const a=available(it.id,DB.period.start,DB.period.end);
  if(a===0) return '<span class="pill bad">Fully booked</span>';
  if(a<=Math.max(2,Math.ceil(it.stock*.2))) return `<span class="pill warn">Only ${a} left</span>`;
  return `<span class="pill ok">${a} available</span>`;
}

function doAuth(){
  const reg=UI.authMode==='register'; const e=$('#a-email').value.trim().toLowerCase(); const p=$('#a-pass').value; const err=$('#aErr');
  const fail=m=>{err.textContent=m;err.hidden=false};
  if(!/^\S+@\S+\.\S+$/.test(e)) return fail('Enter a valid email address.');
  if(reg){
    const n=$('#a-name').value.trim(), ph=$('#a-phone').value.trim();
    if(n.length<3) return fail('Enter your full name as it appears on your ID.');
    if(!/^[0-9 +()-]{7,}$/.test(ph)) return fail('Enter a valid mobile number.');
    if(p.length<6) return fail('Use at least 6 characters for your password.');
    if(p!==$('#a-pass2').value) return fail('The passwords don\'t match.');
    if(DB.users.some(u=>u.email===e)) return fail('An account with this email already exists. Log in instead.');
    const u={id:'u'+Date.now(),name:n,email:e,pass:p,phone:ph,role:'customer',joined:TODAY}; DB.users.push(u); DB.session=u.id; save(); toast('Account created. Welcome to RentHub!');
  } else {
    const u=DB.users.find(x=>x.email===e&&x.pass===p); if(!u) return fail('That email and password don\'t match an account.');
    DB.session=u.id; save(); toast(`Logged in as ${u.name}`);
  }
  const u=me(); const next=UI.authNext; UI.authNext=null;
  go(u.role==='admin'?'admin':(next||'account'));
}

function setStatus(code, s){
  const r=DB.reservations.find(x=>x.code===code); if(!r) return;
  if(s==='pending' && r.status==='cancelled'){
    const cf=conflicts(r.lines,r.start,r.end,r.code);
    if(cf.length){ toast(`Can't restore ${code}: ${cf.map(c=>`${item(c.id).name} has only ${c.have} free`).join(', ')}. Double booking blocked.`,true); return; }
  }
  const apply=()=>{ r.status=s; save(); render(); toast(`${code} marked ${STATUS[s][0].toLowerCase()}`); };
  if(s==='cancelled') confirmBox(`Cancel ${code}?`,'The held units will be released and become bookable by other customers.','Cancel reservation',apply,true); else apply();
}

  <div class="legend"><span><i style="background:var(--ok-bg)"></i>Plenty free</span><span><i style="background:var(--warn-bg)"></i>20% or less free</span><span><i style="background:var(--bad-bg)"></i>Fully booked</span><span><i style="background:var(--surface-2)"></i>Maintenance</span></div>
  <div class="panel tbl-wrap" style="padding:12px"><table class="cal"><thead><tr><th></th>${days.map(d=>`<th class="${d===TODAY?'today':''}">${fmtDow(d)}<br>${parse(d).getDate()}</th>`).join('')}</tr></thead><tbody>
  ${DB.items.map(it=>`<tr><td class="nm">${esc(it.name)} <span class="muted num">/${it.stock}</span></td>${days.map(d=>{if(it.status!=='active')return `<td><div class="c mt">–</div></td>`;const a=it.stock-bookedOn(it.id,d);const l=a<=0?2:a<=Math.ceil(it.stock*.2)?1:0;return `<td><div class="c l${l}" title="${esc(it.name)} on ${fmt(d)}: ${a} of ${it.stock} free">${a}</div></td>`}).join('')}</tr>`).join('')}
  </tbody></table></div>`;
}
function adminCustomers(){
  const cs=DB.users.filter(u=>u.role==='customer');
  return `<div><div class="eyebrow">Accounts</div><h1 style="margin-top:4px">Customers</h1></div>
  <div class="panel tbl-wrap"><table><thead><tr><th>Customer</th><th>Mobile</th><th>Joined</th><th class="num">Reservations</th><th class="num">Active</th><th class="num">Lifetime rentals</th></tr></thead><tbody>
  ${cs.map(u=>{const rs=DB.reservations.filter(r=>r.userId===u.id);return `<tr><td><div class="row" style="flex-wrap:nowrap"><span class="avatar">${esc(initials(u.name))}</span><span><b>${esc(u.name)}</b><div class="muted" style="font-size:12.5px">${esc(u.email)}</div></span></div></td><td class="num">${esc(u.phone)}</td><td class="num">${fmt(u.joined)}</td><td class="num">${rs.length}</td><td class="num">${rs.filter(r=>HOLD.includes(r.status)).length}</td><td class="num">${peso(rs.filter(r=>r.status!=='cancelled').reduce((a,r)=>a+resRentalSubtotal(r),0))}</td></tr>`}).join('')}
  </tbody></table></div>`;
}

/* ---------- render ---------- */
function footer(){
  return `<footer class="foot"><div class="wrap">
    <div style="display:grid;gap:12px;align-content:start"><div class="brand"><img src="${LOGO}" alt=""><span><b>Rent<span>Hub</span></b><small>GENSAN</small></span></div><p class="muted" style="font-size:14px;max-width:36ch">Rent what you need, the smarter choice indeed. Event, entertainment, photography, camping and beach gear in General Santos City.</p></div>
    <div><h4>Equipment</h4><ul>${CATS.map(c=>`<li><button data-cat-go="${c.id}">${c.name}</button></li>`).join('')}</ul></div>
    <div><h4>Renting</h4><ul><li><button data-go="how">How it works</button></li><li><button data-go="how">Pickup policy</button></li><li><button data-go="cart">Your cart</button></li><li><button data-go="account">My reservations</button></li></ul></div>
    <div><h4>Visit us</h4><ul><li>Pioneer Avenue, Dadiangas West</li><li>General Santos City 9500</li><li>Mon–Sat 8 AM – 6 PM</li><li>Sun 9 AM – 3 PM</li></ul></div>
  </div><div class="foot-bottom"><div class="wrap"><span>© 2026 RentHub GenSan. All rights reserved.</span><span>Pickup only · No delivery or shipping</span></div></div></footer>`;
}
function render(){
  const u=me();
  if(['account','checkout'].includes(UI.view) && !u){ UI.authNext=UI.view; UI.view='auth'; }
  if(UI.view==='admin' && (!u||u.role!=='admin')){ UI.authNext=null; UI.view='auth'; }
  if(UI.view==='account' && u && u.role==='admin') UI.view='admin';
  if(UI.view==='checkout' && !DB.cart.length) UI.view='cart';
  renderHeader();
  const pages={home:pageHome,catalog:pageCatalog,cart:pageCart,checkout:pageCheckout,confirm:pageConfirm,auth:pageAuth,account:pageAccount,admin:pageAdmin,
    how:()=>`<div class="page-head"><div class="wrap"><div class="crumbs">Home / How it works</div><h1>How renting works</h1></div></div><section class="section"><div class="wrap">${stepsHtml()}</div></section>${pickupBand()}`};
  $('#app').innerHTML=(pages[UI.view]||pageHome)() + (UI.view==='admin'?'':footer());
  bind();
}
function bind(){
  const hs=$('#heroSearch'); if(hs) hs.onsubmit=e=>{e.preventDefault(); setPeriod($('#hs-start').value,$('#hs-end').value,true); go('catalog',{cat:$('#hs-cat').value});};
  const q=$('#q'); if(q) q.oninput=()=>{ UI.q=q.value; const pos=q.selectionStart; render(); const n=$('#q'); n.focus(); n.setSelectionRange(pos,pos); };
  const s=$('#sort'); if(s) s.onchange=()=>{UI.sort=s.value;render();};
  const cq=$('#clearQ'); if(cq) cq.onclick=()=>{UI.q='';render();};
  const tc=$('#toCheckout'); if(tc) tc.onclick=()=>{ if(!me()){UI.authNext='checkout';go('auth');} else go('checkout'); };
  document.querySelectorAll('[data-cqi]').forEach(inp=>inp.onchange=()=>{ const l=DB.cart[+inp.dataset.cqi]; l.qty=Math.max(1,Math.floor(+inp.value||1)); save(); render(); });
  const co=$('#coForm'); if(co){ co.onsubmit=e=>{e.preventDefault();placeOrder();}; co.querySelectorAll('input[name=pay]').forEach(r=>r.onchange=()=>UI.checkout.pay=r.value); }
  const af=$('#authForm'); if(af) af.onsubmit=e=>{e.preventDefault();doAuth();};
  const pf=$('#profForm'); if(pf) pf.onsubmit=e=>{e.preventDefault(); const u=me(); u.name=$('#p-name').value.trim()||u.name; u.phone=$('#p-phone').value.trim()||u.phone; save(); render(); toast('Profile saved');};
  const rq=$('#resQ'); if(rq) rq.oninput=()=>{UI.resQ=rq.value; const p=rq.selectionStart; render(); const n=$('#resQ'); n.focus(); n.setSelectionRange(p,p);};
  const ai=$('#addItem'); if(ai) ai.onclick=()=>editItem(null);
  document.querySelectorAll('[data-package-fin]').forEach(select=>select.onchange=()=>{UI.packageFin=select.value;render();});
}
function setPeriod(start,end,quiet){
  if(!start) start=DB.period.start; if(!end) end=DB.period.end;
  if(start<TODAY){ start=TODAY; if(!quiet) toast('Pickup date can\'t be in the past.',true); }
  if(end<start){ end=addDays(start,1); if(!quiet) toast('Return date moved to the day after pickup.'); }
  if(daysBetween(start,end)>30){ end=addDays(start,30); toast('Online reservations are limited to 30 days. Call us for longer rentals.'); }
  DB.period={start,end}; save();
}

/* global delegated clicks */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-close],.overlay'); if(!t) return;
  if(t.matches('.overlay') && e.target!==t) return;
  if(t.hasAttribute('data-close') && (t.matches('.overlay')? e.target===t : true)){ closeModal(); return; }
  const d=t.dataset;
  if(t.id==='menuBtn'){ UI.menu=!UI.menu; renderHeader(); return; }
  if(d.go){ if(d.go==='how'&&UI.view==='home'){ UI.menu=false; renderHeader(); $('#how').scrollIntoView({behavior:'smooth'}); return;} go(d.go); return; }
  if(d.catGo){ go('catalog',{cat:d.catGo,q:''}); return; }
  if(d.catSet){ UI.cat=d.catSet; render(); return; }
  if(d.item){ itemModal(d.item); return; }
  if(d.cq!==undefined){ const l=DB.cart[+d.cq]; l.qty=Math.max(1,l.qty+(+d.d)); save(); render(); return; }
  if(d.rm!==undefined){ const l=DB.cart.splice(+d.rm,1)[0]; save(); render(); toast(`Removed ${item(l.itemId).name}`); return; }
  if(d.slot){ UI.checkout.slot=d.slot; document.querySelectorAll('.slot').forEach(s=>s.classList.toggle('on',s===t)); return; }
  if(d.auth){ UI.authMode=d.auth; render(); return; }
  if(d.demo){ const [em,pw]=d.demo.split('|'); $('#a-email').value=em; $('#a-pass').value=pw; return; }
  if(t.id==='logout'){ DB.session=null; save(); go('home'); toast('Logged out'); return; }
  if(d.acct){ UI.acctTab=d.acct; render(); return; }
  if(d.cancel){ confirmBox(`Cancel ${d.cancel}?`,'Your held units will be released for other renters. GCash down payments are refunded within 3 business days.','Cancel reservation',()=>{ DB.reservations.find(r=>r.code===d.cancel).status='cancelled'; save(); render(); toast('Reservation cancelled'); },true); return; }
  if(d.atab){ UI.adminTab=d.atab; render(); return; }
  if(d.rf){ UI.resFilter=d.rf; render(); return; }
  if(d.st){ const [c,s]=d.st.split('|'); setStatus(c,s); return; }
  if(d.edit){ editItem(d.edit); return; }
});
document.addEventListener('change',e=>{
  const p=e.target.dataset?.period; if(!p) return;
  const inModal=e.target.closest('.modal'); const openId=inModal && document.querySelector('.modal [data-q]') ? document.querySelector('#modalRoot .art')?.closest('.pd') && currentModalItem : null;
  setPeriod(p==='start'?e.target.value:null, p==='end'?e.target.value:null);
  if(p==='start' && DB.period.end<=DB.period.start){}
  render();
  if(inModal && currentModalItem) itemModal(currentModalItem);
});
let currentModalItem=null;
const _itemModal=itemModal; itemModal=id=>{ currentModalItem=id; _itemModal(id); };
const _closeModal=closeModal; closeModal=()=>{ currentModalItem=null; _closeModal(); };
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && $('#modalRoot').innerHTML) closeModal(); });

const h=location.hash.slice(1); if(['catalog','cart','admin','account','auth','how'].includes(h)) UI.view=h;
render();
</script>
